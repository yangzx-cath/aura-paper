<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>灵动绘卷 · 阅读</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../static/shared/tokens.css">
  <link rel="stylesheet" href="../static/shared/base.css">
  <link rel="stylesheet" href="../static/shared/page.css">
  <link rel="stylesheet" href="book.css">
</head>
<body>
  <div class="app reader">
    <header class="reader-bar">
      <a class="reader-btn" href="./">← 书库</a>
    </header>

    <main class="stage" id="stage">
      <!-- 成片先用 C01 的 film.mp4，接 show.json 后改成按书读取。 -->
      <video class="stage-film" id="film" src="/media/C01/shots/film.mp4"
             playsinline preload="metadata"></video>
      <p class="stage-note">AI 生成内容存在不确定性 · 语音图像已脱敏</p>
    </main>

    <p class="subtitle" id="subtitle">字幕</p>

    <footer class="deck">
      <button class="deck-play" id="play" type="button" aria-label="播放">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="5" width="4" height="14" rx="1"/>
          <rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
      </button>
      <div class="track" id="track">
        <div class="track-bar">
          <div class="track-fill" id="fill"></div>
        </div>
      </div>
      <div class="deck-tools">
        <button class="deck-mic" id="mic" type="button" aria-pressed="false"
                aria-label="麦克风">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 17.5V21M9 21h6" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="deck-tool" type="button">对话</button>
      </div>
    </footer>

    <p class="toast" id="toast"></p>
  </div>

  <script src="book.js"></script>
</body>
</html>
