[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-paper"
description = "An interactive video adaptation of a paper picture book"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "pillow>=11.0",
    "pypdfium2>=5.15",
    "websockets>=14.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "rapidocr>=3.10",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8.4"]

[tool.hatch.version]
path = "aura_paper/__init__.py"

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
